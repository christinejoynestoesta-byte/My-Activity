    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);

            width: 100%;
            padding: 36px 28px;

        }

            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #3b82f6;
            margin-bottom: 20px;
            background-color: #e2e8f0;
        }

            font-size: 24px;
            color: #1e293b;
            margin: 0 0 8px 0;
        }
        .subtitle {
            font-size: 14px;
            color: #64748b;
            margin: 0 0 20px 0;
        }
        .bio {
            font-size: 15px;
            line-height: 1.6;
            color: #475569;
            margin: 0 0 24px 0;
        }
        .tag {
            display: inline-block;
            background-color: #eff6ff;
            color: #2563eb;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
